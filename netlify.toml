[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/.well-known/*"
  to = "/.well-known/:splat"
  status = 200
  force = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"

[secrets_scanning]
  enabled = true
  omit_values = ["VITE_GOOGLE_MAPS_KEY"]
