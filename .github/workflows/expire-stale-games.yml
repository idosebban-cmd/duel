name: Expire stale games

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  expire-stale-games:
    runs-on: ubuntu-latest
    steps:
      - name: Call expire_stale_games RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY secret."
            exit 1
          fi

          request_body='{"p_params":{}}'

          response="$(curl -sS -X POST \
            "$SUPABASE_URL/rest/v1/rpc/expire_stale_games" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Content-Type: application/json" \
            -d "$request_body")"

          echo "Raw response: $response"

          expired_count="$(echo "$response" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d if isinstance(d,int) else d.get("count", d.get("expired_count", d)))')"
          echo "Expired stale games count: $expired_count"
